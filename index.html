<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<meta name="format-detection" content="telephone=no">
<title>Фото Пазл</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="stylesheet" href="v4/app.css">
<link rel="stylesheet" href="v8/app.css">
<link rel="stylesheet" href="v10/cases.css">
<link rel="stylesheet" href="v13/app.css">
<link rel="stylesheet" href="v16/app.css">
<link rel="stylesheet" href="v18/app.css">
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div id="loader"><div class="spin"></div><div class="lmsg">Завантаження…</div></div>

<section class="screen" id="home"><div class="wrap" id="homeW"></div></section>
<section class="screen" id="levels"><div class="wrap" id="levelsW"></div></section>
<section class="screen" id="arena"><div class="wrap" id="arenaW"></div></section>
<section class="screen" id="hero"><div class="wrap" id="heroW"></div></section>
<section class="screen" id="profile"><div class="wrap" id="profileW"></div></section>
<section class="screen notab" id="cases"><div class="wrap" id="casesW"></div></section>
<section class="screen notab" id="friendpage"><div class="wrap" id="friendpageW"></div></section>
<section class="screen notab" id="friends"><div class="wrap" id="friendsW"></div></section>
<section class="screen notab" id="daily"><div class="wrap" id="dailyW"></div></section>
<section class="screen notab" id="free"><div class="wrap" id="freeW"></div></section>
<section class="screen notab" id="ws"><div class="wrap" id="wsW"></div></section>

<section class="screen notab" id="gs">
  <div class="gtop">
    <button class="ib" id="gBack" aria-label="Пауза">⏸️</button>
    <div class="gmid"><span class="glvl" id="gLvl"></span><span class="pill" id="gTime">0:00</span></div>
    <button class="ib" id="gHint" aria-label="Підказка">💡<span class="cnt" id="gHintN">0</span></button>
    <button class="ib" id="gGhost" aria-label="Контур">👁️</button>
    <button class="skb hidden" id="skBtn" aria-label="Суперудар">🌀<small>0%</small></button>
    <button class="ib" id="gShuf" aria-label="Перемішати">🔀</button>
    <button class="ib pv" id="gPrev" aria-label="Картинка"><canvas id="prevC" width="40" height="40"></canvas></button>
  </div>
  <div class="fhud" id="fhud">
    <div class="fp"><div class="fav" id="fMeAv">🦊</div><div class="fbars"><div class="fname" id="fMeN">Ти</div><div class="hp"><i id="fMeHp"></i></div><div class="en"><i id="fMeEn"></i></div></div></div>
    <div class="fvs"><b id="fTime">3:00</b>VS</div>
    <div class="fp opp"><div class="fav" id="fOpAv">🤖</div><div class="fbars"><div class="fname" id="fOpN">Суперник</div><div class="hp"><i id="fOpHp"></i></div><div class="en"><i id="fOpEn"></i></div></div></div>
  </div>
  <div class="gprog" id="gprog"><div class="bar"><i id="gBar"></i></div><span class="lbl" id="gPct">0/0</span></div>
  <div id="stage">
    <div id="boardBg"></div>
    <canvas id="ghost"></canvas>
    <svg id="gridSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="fullImg"></canvas>
    <div id="trayBg"></div>
    <div id="layer"></div>
    <div class="fxo fog" id="fxFog">🌫️ Туман!</div>
    <div class="fxo frz" id="fxFrz">❄️ Заморозка!</div>
    <div id="cov"><span>3</span></div>
    <div id="gload"><div class="spin"></div><div class="lmsg" id="gloadMsg">Завантаження…</div></div>
    <div id="prevBig"><canvas id="prevBigC"></canvas></div>
  </div>
</section>

<nav class="tabbar hide" id="tabbar"><div class="tabin">
  <button class="tab" data-t="home"><span class="ti">🏠</span>Головна<span class="badge" id="bd-home"></span></button>
  <button class="tab" data-t="levels"><span class="ti">🗺️</span>Рівні<span class="badge" id="bd-levels"></span></button>
  <button class="tab" data-t="arena"><span class="ti">⚔️</span>Арена<span class="badge" id="bd-arena"></span></button>
  <button class="tab" data-t="hero"><span class="ti" id="tabHero">🦊</span>Герой<span class="badge" id="bd-hero"></span></button>
  <button class="tab" data-t="profile"><span class="ti">👤</span>Профіль<span class="badge" id="bd-profile"></span></button>
</div></nav>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<div id="cfw"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="avatarFile" accept="image/*" hidden>

<script src="v12/data.js"></script>
<script src="v5/store.js"></script>
<script src="v12/prog.js"></script>
<script src="js/media.js?v=3"></script>
<script src="js/puzzle.js?v=3"></script>
<script src="v4/sound.js"></script>
<script src="v18/ui.js"></script>
<script src="v13/arena.js"></script>
<script src="v17/avatars.js"></script>
<script src="v18/social.js"></script>
<script src="v5/team.js"></script>
<script src="v11/cases.js"></script>
<script src="v18/update.js"></script>
<script src="v13/queue.js"></script>
<script src="v18/backgrounds.js"></script>
<script src="v17/main.js"></script>
</body>
</html>
